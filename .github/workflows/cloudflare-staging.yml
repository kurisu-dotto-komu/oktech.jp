name: Cloudflare Staging

on:
  push:
    branches: ["sveltia-cms"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STAGING_HOST: ${{ vars.STAGING_HOST }}
  SITE_URL: https://${{ vars.STAGING_HOST }}
  PUBLIC_CMS_REPO: ${{ github.repository }}
  PUBLIC_CMS_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # Bump to invalidate the Astro image cache
  ASTRO_CACHE_KEY: v1

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # node_modules is ~2 GB; restoring it beats `npm ci` from the registry.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.astro
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Optimized images live in node_modules/.astro. PRs can only read caches
      # saved on their base branch, so branch pushes save and PRs restore-only;
      # restore-keys gives a partial hit whenever any image changes.
      - name: Restore Astro image cache
        id: astro-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-${{ env.ASTRO_CACHE_KEY }}-${{ hashFiles('content/**/*.{png,jpg,jpeg,webp,avif,gif,svg}', 'src/assets/**/*.{png,jpg,jpeg,webp,avif,gif,svg}') }}
          restore-keys: ${{ runner.os }}-astro-${{ env.ASTRO_CACHE_KEY }}-

      - run: npx astro build

      - name: Save Astro image cache
        if: github.event_name != 'pull_request' && steps.astro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.astro
          key: ${{ steps.astro-cache.outputs.cache-primary-key }}

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          npx wrangler versions upload --message "PR #${{ github.event.pull_request.number }} ${{ github.sha }}" | tee upload.log
          echo "url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v8
        with:
          script: |
            const url = "${{ steps.preview.outputs.url }}";
            const marker = "<!-- cloudflare-preview -->";
            const body = `${marker}\n🔎 Preview for ${context.sha.slice(0, 7)}: ${url}\n\nCMS: ${url}/admin`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Deploy to ${{ vars.STAGING_HOST }}
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy --domain "$STAGING_HOST"
