name: Cloudflare Staging

on:
  push:
    branches: ["sveltia-cms"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STAGING_HOST: ${{ vars.STAGING_HOST }}
  SITE_URL: https://${{ vars.STAGING_HOST }}
  PUBLIC_CMS_REPO: ${{ github.repository }}
  PUBLIC_CMS_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  # CMS uploads go to the R2 bucket (see docs/cloudflare.md); the account id is not secret but is masked in logs
  PUBLIC_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PUBLIC_R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
  PUBLIC_R2_BUCKET: ${{ vars.R2_BUCKET }}
  # Set to the upload Worker origin to route CMS uploads through its maintainer whitelist;
  # leave the variable unset to sign uploads straight against R2.
  PUBLIC_MEDIA_UPLOAD_ENDPOINT: ${{ vars.MEDIA_UPLOAD_ENDPOINT }}
  # Read at build time to stitch venue map tiles for venues with no committed bitmap
  STADIA_MAPS_API_KEY: ${{ secrets.STADIA_MAPS_API_KEY }}
  # Preview overlay (empty on branch deploys)
  PUBLIC_PREVIEW_PR: ${{ github.event.pull_request.number }}
  PUBLIC_PREVIEW_BRANCH: ${{ github.head_ref }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # Bump to invalidate the Astro image cache
  ASTRO_CACHE_KEY: v1

jobs:
  deploy:
    if: github.event.action != 'closed'
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # node_modules is ~2 GB; restoring it beats `npm ci` from the registry.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.astro
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Optimized images live in node_modules/.astro. PRs can only read caches
      # saved on their base branch, so branch pushes save and PRs restore-only;
      # restore-keys gives a partial hit whenever any image changes.
      - name: Restore Astro image cache
        id: astro-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-${{ env.ASTRO_CACHE_KEY }}-${{ hashFiles('content/**/*.webp', 'content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'content/**/*.svg', 'src/assets/**') }}
          restore-keys: ${{ runner.os }}-astro-${{ env.ASTRO_CACHE_KEY }}-

      - run: npx astro build

      - name: Save Astro image cache
        if: github.event_name != 'pull_request' && steps.astro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.astro
          key: ${{ steps.astro-cache.outputs.cache-primary-key }}

      # Each PR gets its own Worker + hostname; the close job below removes it
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          host="pr-$PR-preview.$STAGING_HOST"
          npx wrangler deploy --name "oktech-pr-$PR" --domain "$host"
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      # CMS-created PRs (branch cms/**) get a generated description of the content changes
      - name: Summarise content changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=1 origin "$BASE" "$HEAD"
          npx tsx scripts/pr-summary.ts "$BASE" "$HEAD" "${{ steps.preview.outputs.url }}" "$SITE_URL/admin" > pr-summary.md

      # The commit status is what Sveltia CMS reads to offer a "View Preview" link in the editor
      - name: Publish preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const url = "${{ steps.preview.outputs.url }}";
            const fs = require("fs");
            const summary = fs.readFileSync("pr-summary.md", "utf8").trim();
            const pr = context.payload.pull_request;
            if (pr.head.ref.startsWith("cms/")) {
              const original = (pr.body ?? "").split("<!-- cms-summary -->")[0].trim();
              const body = `${summary}\n\n---\n${original || "Automatically generated by Sveltia CMS"}`;
              await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, body });
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              state: "success",
              context: "Cloudflare Preview",
              description: "Preview deployment ready",
              target_url: url,
            });
            const marker = "<!-- cloudflare-preview -->";
            const body = `${marker}\n🔎 Preview for ${context.sha.slice(0, 7)}: ${url}\n\nCMS: ${url}/admin`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Deploy to ${{ vars.STAGING_HOST }}
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy --domain "$STAGING_HOST"

  cleanup:
    if: github.event.action == 'closed'
    name: Remove preview
    runs-on: ubuntu-latest
    steps:
      # Direct API calls: `wrangler delete` also tries to list KV namespaces, which the token can't
      - env:
          NAME: oktech-pr-${{ github.event.pull_request.number }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for id in $(curl -sf -H "$auth" "$api/domains" | jq -r --arg s "$NAME" '.result[] | select(.service == $s) | .id'); do
            curl -sf -o /dev/null -X DELETE -H "$auth" "$api/domains/$id"
          done
          curl -sf -o /dev/null -X DELETE -H "$auth" "$api/scripts/$NAME" || echo "$NAME already gone"
